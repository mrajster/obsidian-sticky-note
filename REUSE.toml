version = 1

[[annotations]]
path = [
    ".gitignore",
    "README.md",
    "docs/screenshots/**.png",
    "tests/format-reference.md",
    "tests/obsidian-torture.md",
    "tests/geometry/FORMAT-REFERENCE.md",
    "tests/geometry/obsidian-1.13.7-rects.json",
    "tests/geometry/obsidian-1.13.7-rects-380.json",
